name: Single Job Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  simple-test:
    name: Simple Test Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check Node version
        run: node --version

      - name: Check npm version
        run: npm --version

      - name: List files
        run: ls -la

      - name: Success message
        run: echo "✅ Single job completed successfully!" 